[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic_monitoring_system"
version = "1.0.0"
description = "Machine Acoustic Monitoring System with Adaptive Multi-Band Resource-Aware Acoustic Gate"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dsp*", "ml*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
